apiVersion: v1
kind: Secret
metadata:
  name: falkordb-custom-account
  namespace: demo
type: Opaque
stringData:
  username: default
  password: replace-with-a-strong-password
---
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: falkordb-custom-secret
  namespace: demo
spec:
  terminationPolicy: Delete
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      serviceVersion: "4.20.1"
      replicas: 2
      # Overrides the auto-generated password of the `default` system account
      # with the credentials stored in an existing Secret.
      systemAccounts:
        - name: default
          secretRef:
            name: falkordb-custom-account
            namespace: demo
      resources:
        limits:
          cpu: '0.5'
          memory: 0.5Gi
        requests:
          cpu: '0.5'
          memory: 0.5Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
    - name: falkordb-sent
      serviceVersion: "4.20.1"
      replicas: 3
      systemAccounts:
        - name: default
          secretRef:
            name: falkordb-custom-account
            namespace: demo
      resources:
        limits:
          cpu: '0.5'
          memory: 0.5Gi
        requests:
          cpu: '0.5'
          memory: 0.5Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
