apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: falkordb-replication-restore
  namespace: demo
  annotations:
    # The backup to restore from, keyed by component name. `sourceTargetName`
    # picks the backup target when the backup policy has more than one, and can
    # be omitted otherwise.
    #
    # This requires KubeBlocks <= 1.2.0-alpha.1. The annotation was removed in
    # 1.2.0-alpha.2 in favour of `Cluster.spec.restore`, and removed rather than
    # deprecated: on 1.2.0-alpha.2 and later it is dropped without an error and
    # the cluster comes up Running with an empty dataset. `spec.restore` is not a
    # usable replacement yet either, so there is currently no restore path on
    # those versions. See https://github.com/apecloud/kubeblocks/issues/10755.
    kubeblocks.io/restore-from-backup: '{"falkordb":{"name":"falkordb-backup-datafile","namespace":"demo","volumeRestorePolicy":"Parallel","sourceTargetName":"falkordb"}}'
spec:
  terminationPolicy: Delete
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      serviceVersion: "4.20.2"
      disableExporter: false
      replicas: 2
      resources:
        limits:
          cpu: '0.5'
          memory: 0.5Gi
        requests:
          cpu: '0.5'
          memory: 0.5Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: ""
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
    - name: falkordb-sent
      serviceVersion: "4.20.2"
      replicas: 3
      resources:
        limits:
          cpu: '0.5'
          memory: 0.5Gi
        requests:
          cpu: '0.5'
          memory: 0.5Gi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName: ""
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
