apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  name: falkordb-reshard-slots
  namespace: demo
spec:
  # Specifies the name of the Cluster resource that this operation is targeting.
  clusterName: falkordb-sharding
  type: Custom
  custom:
    opsDefinitionName: falkordb-cluster-reshard
    components:
      # The sharding name. The operation runs once for the whole cluster.
      - componentName: shard
        parameters:
          # The hash slots to move: single slots and inclusive ranges,
          # separated by commas. Slots that already belong to TO are skipped.
          - name: SLOTS
            value: "0-999,5000"
          # The shard to move them to. Shard names are generated when the
          # cluster is created, so replace the placeholders with your own,
          # listed by:
          #   kubectl get component -n demo -l app.kubernetes.io/instance=falkordb-sharding
          # Any of these forms is accepted:
          #   - the short name, without the cluster name, e.g. shard-98x
          #   - the full component name, e.g. falkordb-sharding-shard-98x
          #   - the node ID of the shard's primary
          - name: TO
            value: "<target-shard>"
          # Optional, named the same way as TO. The shard the slots are
          # expected to come from: when set, the operation is refused unless
          # that shard owns every listed slot that TO does not already own.
          - name: FROM
            value: "<source-shard>"
