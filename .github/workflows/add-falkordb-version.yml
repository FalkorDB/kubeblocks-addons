name: Add FalkorDB Version

# Registers a released FalkorDB image as a supported version of the falkordb
# addon and opens a pull request with the change. The chart is released by the
# usual chart automation once that pull request is merged.
#
# Triggered manually from the Actions tab, or remotely from the FalkorDB core
# repo with:
#   curl -X POST \
#     -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $TOKEN" \
#     https://api.github.com/repos/apecloud/kubeblocks-addons/dispatches \
#     -d '{"event_type":"falkordb-release","client_payload":{"version":"4.20.2"}}'
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released FalkorDB version (e.g. 4.20.2)"
        required: true
        type: string
      image_tag:
        description: "Image tag of the release (defaults to v<version>)"
        required: false
        type: string
      set_default:
        description: "Make this the default serviceVersion for its major version"
        required: false
        type: boolean
        default: true
      base_branch:
        description: "Branch to open the pull request against"
        required: false
        type: string
        default: main
  repository_dispatch:
    types:
      - falkordb-release

permissions:
  contents: write
  pull-requests: write

jobs:
  add-version:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: inputs
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.client_payload.image_tag }}
          SET_DEFAULT: ${{ github.event.inputs.set_default || github.event.client_payload.set_default || 'true' }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.client_payload.base_branch || 'main' }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version '$VERSION', expected MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG:-v$version}" >> "$GITHUB_OUTPUT"
          echo "set_default=$SET_DEFAULT" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      # The pull request targets the base branch, so the change has to be made on
      # top of it. Checking out the branch the workflow was started from would
      # drag every unrelated commit into the pull request.
      - name: Checkout ${{ steps.inputs.outputs.base_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.base_branch }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Verify the image exists
        env:
          REPOSITORY: falkordb/falkordb
          IMAGE_TAG: ${{ steps.inputs.outputs.image_tag }}
        run: |
          set -euo pipefail
          url="https://hub.docker.com/v2/repositories/${REPOSITORY}/tags/${IMAGE_TAG}"
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
          if [[ "$code" != "200" ]]; then
            echo "::error::image ${REPOSITORY}:${IMAGE_TAG} not found on Docker Hub (HTTP $code)"
            exit 1
          fi

      - name: Register the version
        id: add-version
        run: |
          python3 hack/falkordb-add-version.py \
            --version "${{ steps.inputs.outputs.version }}" \
            --image-tag "${{ steps.inputs.outputs.image_tag }}" \
            --bump-chart \
            ${{ steps.inputs.outputs.set_default == 'true' && '--set-default' || '' }}

      - name: Lint and render the chart
        if: steps.add-version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # charts/ and Chart.lock are gitignored, so the kblib dependency has to
          # be fetched before the chart can be linted or rendered.
          helm dependency build addons/falkordb
          helm lint addons/falkordb
          helm template falkordb addons/falkordb > /dev/null

      # A version that lands in values.yaml but not in the docs is exactly the
      # drift this workflow exists to prevent, so check rather than trust.
      - name: Verify the docs list the new version
        if: steps.add-version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.add-version.outputs.version }}
        run: |
          set -euo pipefail
          for file in addons/falkordb/README.md examples/falkordb/README.md; do
            if ! grep -q "$VERSION" "$file"; then
              echo "::error::$file does not mention $VERSION"
              exit 1
            fi
          done

      - name: Open the pull request
        if: steps.add-version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ steps.inputs.outputs.base_branch }}
          branch: falkordb/add-version-${{ steps.add-version.outputs.version }}
          delete-branch: true
          commit-message: "chore(falkordb): support FalkorDB ${{ steps.add-version.outputs.version }}"
          title: "chore(falkordb): support FalkorDB ${{ steps.add-version.outputs.version }}"
          body: |
            Adds FalkorDB `${{ steps.add-version.outputs.version }}` (image tag `${{ steps.add-version.outputs.image_tag }}`) to the supported versions of the `falkordb` addon.

            | | |
            |---|---|
            | default serviceVersion for its major | `${{ steps.add-version.outputs.is_default }}` |
            | addon chart version | `${{ steps.add-version.outputs.chart_version }}` |
            | triggered by | `${{ github.event_name }}` |

            Updated by `hack/falkordb-add-version.py`:

            - `addons/falkordb/values.yaml` — new `mirrorVersions` entry, plus `serviceVersion`/`defaultImageTag` when this release is the newest of its major
            - `addons/falkordb/Chart.yaml` — chart version and `appVersion`
            - `addons/falkordb/README.md` and `examples/falkordb/README.md` — supported-versions table and the `Valid options are:` hints
            - `addons-cluster/falkordb/` — `values.yaml`, `values.schema.json` and `Chart.yaml` defaults
            - `examples/falkordb/*.yaml` — pinned `serviceVersion`

            The chart is released once this pull request is merged.

      - name: Report a no-op
        if: steps.add-version.outputs.changed != 'true'
        run: echo "::notice::FalkorDB ${{ steps.inputs.outputs.version }} is already supported, no pull request opened"
