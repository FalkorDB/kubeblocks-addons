name: Release FalkorDB Chart

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Chart version to release (e.g. 0.1.0). Defaults to version in Chart.yaml."
        required: false
        default: ""
        type: string
      DRY_RUN:
        description: "Skip push/release steps (for testing)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      VERSION:
        description: "Chart version to release (e.g. 0.1.0). Defaults to version in Chart.yaml."
        type: string
        required: false
        default: ""
      DRY_RUN:
        description: "Skip push/release steps (for testing)"
        type: boolean
        required: false
        default: false

run-name: Release FalkorDB Chart ${{ inputs.VERSION || '(auto)' }}

env:
  HELM_VERSION: "v3.16.3"
  CHART_DIR: "addons/falkordb"

jobs:
  release-falkordb-chart:
    name: Release addons/falkordb
    # Serialize every publishing run (any ref, any caller) from the
    # "already released" check through the push, so two runs for the same
    # VERSION cannot both pass the check. Dry runs never publish and run apart.
    concurrency:
      group: ${{ inputs.DRY_RUN && format('falkordb-chart-dry-run-{0}', github.run_id) || 'falkordb-chart-publish' }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Determine chart version
        id: version
        shell: bash
        run: |
          version="${{ inputs.VERSION }}"
          version="${version#v}"
          if [[ -z "$version" ]]; then
            version=$(grep '^version:' ${{ env.CHART_DIR }}/Chart.yaml | awk '{print $2}')
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "Chart version: ${version}"

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.DRY_RUN }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # A published chart version is immutable: never overwrite an existing
      # tag, GitHub release or OCI artifact. Every probe fails closed: only a
      # confirmed "not found" counts as absent; any other error stops the
      # release. In a dry run, hits and probe errors only warn.
      - name: Check version is not already released
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="falkordb-${VERSION}"
          REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          OCI_REF="ghcr.io/${REPO}/falkordb:${VERSION}"
          found=()
          errors=()

          # git tag: ls-remote --exit-code returns 2 when no ref matches.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null || rc=$?
          case "${rc}" in
            0) found+=("git tag ${TAG}") ;;
            2) ;;
            *) errors+=("git ls-remote for ${TAG} failed (exit ${rc})") ;;
          esac

          # GitHub release: only HTTP 404 means absent.
          rc=0
          out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1 > /dev/null) || rc=$?
          if (( rc == 0 )); then
            found+=("GitHub release ${TAG}")
          elif ! grep -q 'HTTP 404' <<< "${out}"; then
            errors+=("release lookup for ${TAG} failed: ${out}")
          fi

          # OCI chart on GHCR: ask the registry for the manifest; 200 means
          # present, 404 absent, anything else (auth, 5xx, network) is an error.
          token=$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}/falkordb:pull" \
            | jq -er .token) || token=""
          if [[ -z "${token}" ]]; then
            errors+=("could not get a GHCR pull token for ${REPO}/falkordb")
          else
            code=$(curl -sS -o /dev/null -w '%{http_code}' --head \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${REPO}/falkordb/manifests/${VERSION}") || code="000"
            case "${code}" in
              200) found+=("OCI chart ${OCI_REF}") ;;
              404) ;;
              *) errors+=("GHCR manifest lookup for ${OCI_REF} returned HTTP ${code}") ;;
            esac
          fi

          level=error
          [[ "${DRY_RUN}" == "true" ]] && level=warning
          status=0
          for e in "${errors[@]}"; do
            echo "::${level}::${e}"
            status=1
          done
          if (( ${#found[@]} > 0 )); then
            echo "::${level}::Chart version ${VERSION} is already released (${found[*]}). Pass a new VERSION; published versions are never overwritten."
            status=1
          fi
          if (( status == 0 )); then
            echo "Version ${VERSION} is not released yet."
          elif [[ "${DRY_RUN}" != "true" ]]; then
            exit 1
          fi

      - name: Update Chart.yaml version
        shell: bash
        run: |
          chart_file="${{ env.CHART_DIR }}/Chart.yaml"
          version="${{ steps.version.outputs.version }}"
          awk -v version="${version}" '
            !updated && $1 == "version:" {
              print "version: " version
              updated = 1
              next
            }
            { print }
          ' "${chart_file}" > "${chart_file}.tmp"
          mv "${chart_file}.tmp" "${chart_file}"
          grep -qx "version: ${version}" "${chart_file}"
          grep '^version:' "${chart_file}"

      - name: Helm Dependency
        run: helm dependency build ${{ env.CHART_DIR }}

      - name: Helm lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package ${{ env.CHART_DIR }} \
            --version "${{ steps.version.outputs.version }}" \
            --destination .cr-release-packages
          ls -la .cr-release-packages/

      - name: Push chart to GHCR (OCI)
        if: ${{ !inputs.DRY_RUN }}
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm push \
            .cr-release-packages/falkordb-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/${REPO}

      - name: Create GitHub Release and upload chart artifact
        if: ${{ !inputs.DRY_RUN }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="falkordb-${{ steps.version.outputs.version }}"
          NOTES="## FalkorDB Helm Chart ${{ steps.version.outputs.version }}"$'\n\n'"Install via OCI:"$'\n'"helm install falkordb oci://ghcr.io/${REPO}/falkordb --version ${{ steps.version.outputs.version }}"
          gh release create "${TAG}" \
            .cr-release-packages/*.tgz \
            --repo "${{ github.repository }}" \
            --title "FalkorDB Chart ${{ steps.version.outputs.version }}" \
            --notes "${NOTES}"
