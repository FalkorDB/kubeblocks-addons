apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-shtls
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: cluster
  shardings:
    - name: shard
      shardingDef: falkordb-cluster
      shards: 3
      template:
        name: falkordb
        disableExporter: true
        replicas: 1
        # Encrypts client traffic and, critically, the cluster bus the shards use
        # to gossip and to migrate slots between each other.
        tls: true
        # The certificates have to be supplied by the user rather than generated
        # by KubeBlocks. KubeBlocks issues a separate self-signed CA per
        # Component, and every shard of a sharding is its own Component, so each
        # shard would receive a certificate signed by a CA that none of its peers
        # trusts. The cluster bus does chain validation on every peer connection,
        # so those connections fail with "certificate verify failed", the nodes
        # never leave the handshake state and `redis-cli --cluster create` blocks
        # forever. One CA shared by all shards is the only configuration that can
        # form a TLS cluster. The secret is generated by the first step of the
        # test, because the namespace is only known at run time.
        issuer:
          name: UserProvided
          secretRef:
            name: fdb-shtls-tls
            ca: ca.crt
            cert: tls.crt
            key: tls.key
        resources:
          limits:
            cpu: '0.5'
            memory: 512Mi
          requests:
            cpu: '0.2'
            memory: 512Mi
        volumeClaimTemplates:
          - name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
