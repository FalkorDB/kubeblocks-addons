apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-snap
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      disableExporter: true
      replicas: 2
      resources:
        limits:
          cpu: '0.5'
          memory: 512Mi
        requests:
          cpu: '0.2'
          memory: 512Mi
      volumeClaimTemplates:
        - name: data
          spec:
            # The default local-path provisioner cannot take CSI snapshots, so
            # the data volume has to come from the hostpath CSI driver the e2e
            # setup installs. Only this component is snapshotted.
            storageClassName: csi-hostpath-sc
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    - name: falkordb-sent
      replicas: 3
      resources:
        limits:
          cpu: '0.5'
          memory: 256Mi
        requests:
          cpu: '0.1'
          memory: 256Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
