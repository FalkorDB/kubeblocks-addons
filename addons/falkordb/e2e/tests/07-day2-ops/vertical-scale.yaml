apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  name: fdb-ops-vscale
spec:
  clusterName: fdb-ops
  type: VerticalScaling
  verticalScaling:
    - componentName: falkordb
      requests:
        cpu: '0.25'
        memory: 640Mi
      limits:
        cpu: '0.6'
        memory: 640Mi
