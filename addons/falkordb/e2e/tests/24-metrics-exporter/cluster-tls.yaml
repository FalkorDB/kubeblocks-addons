apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-metrics-tls
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      disableExporter: false
      replicas: 2
      # With TLS on, REDIS_METRICS_ADDR is produced by a `spec.vars` expression
      # rather than the plain default, and the exporter has to be handed a URL
      # it can actually parse.
      tls: true
      issuer:
        name: KubeBlocks
      resources:
        limits:
          cpu: '0.5'
          memory: 512Mi
        requests:
          cpu: '0.2'
          memory: 512Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    - name: falkordb-sent
      replicas: 3
      tls: true
      issuer:
        name: KubeBlocks
      resources:
        limits:
          cpu: '0.5'
          memory: 256Mi
        requests:
          cpu: '0.1'
          memory: 256Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
