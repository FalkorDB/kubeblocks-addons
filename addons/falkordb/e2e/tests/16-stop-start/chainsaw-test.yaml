apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stop-start
spec:
  description: >-
    Stop the whole cluster and start it again.

    Stop scales every component to zero while keeping the volumes, so the restart
    is the one moment where every pod boots at the same time with data already on
    disk and no surviving member to learn the topology from. Nothing else in the
    suite produces that state: a rolling restart always leaves a running peer
    behind, and a fresh cluster always starts empty.

    That makes it the natural home for two failure modes. The servers have to work
    out which of them is the primary from their own persisted state rather than
    from a live peer, and the sentinels have to re-monitor whatever the servers
    settled on rather than the master they remembered from before the stop.
  steps:
    - name: create the cluster and seed data
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: assert-running.yaml
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_retry "the roles to settle" \
                fdb_assert_role_counts "$NAMESPACE" fdb-stop falkordb 1 1
              primary="$(fdb_primary "$NAMESPACE" fdb-stop falkordb)"

              fdb_write_keys "$NAMESPACE" "$primary" e2e-stop 100
              fdb_graph_roundtrip "$NAMESPACE" "$primary" e2e-stop-graph

              # Nothing survives the stop unless it reached the volume, and the
              # data has to be flushed while a server is still running to flush it.
              fdb_cli "$NAMESPACE" "$primary" SAVE >/dev/null
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-stop
            tail: 100

    - name: stop the cluster
      try:
        - apply:
            file: stop.yaml
        - assert:
            file: assert-stop-succeeded.yaml
        - assert:
            file: assert-stopped.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-stop-ops
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-stop
            tail: 200

    - name: every pod is gone and every volume is kept
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_retry "all pods to disappear" bash -c '
                remaining=$(kubectl get pods -n "'"$NAMESPACE"'" \
                  -l "app.kubernetes.io/instance=fdb-stop" \
                  -o jsonpath="{range .items[*]}{.metadata.name}{\"\n\"}{end}" | grep -c . || true)
                [ "$remaining" -eq 0 ] || { echo "$remaining pod(s) still running" >&2; exit 1; }
                echo "all pods are gone"
              '

              # Stop is not delete. If the volumes went with the pods the restart
              # would come back empty, and an empty cluster that reports Running
              # is indistinguishable from a healthy one until someone reads a key.
              claims="$(kubectl get pvc -n "$NAMESPACE" \
                -l "app.kubernetes.io/instance=fdb-stop" \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -c . || true)"
              if [ "$claims" -lt 5 ]; then
                echo "expected the 5 data volumes to be retained, found $claims" >&2
                kubectl get pvc -n "$NAMESPACE" >&2
                exit 1
              fi
              echo "$claims volumes were retained across the stop"
      catch:
        - events: {}

    - name: start the cluster again
      try:
        - apply:
            file: start.yaml
        - assert:
            file: assert-start-succeeded.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-start-ops
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-stop
            tail: 200

    - name: the restarted cluster rebuilt its topology and kept its data
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # Exactly one primary. A cold start where both servers decide they
              # are the primary is a split brain that silently accepts divergent
              # writes on either side.
              fdb_retry "the roles to settle after the start" \
                fdb_assert_role_counts "$NAMESPACE" fdb-stop falkordb 1 1
              primary="$(fdb_primary "$NAMESPACE" fdb-stop falkordb)"
              replica="$(fdb_pods_with_role "$NAMESPACE" fdb-stop falkordb secondary)"

              fdb_verify_keys "$NAMESPACE" "$primary" e2e-stop 100
              fdb_assert_graph_node "$NAMESPACE" "$primary" e2e-stop-graph

              fdb_retry "the replica to link up again" \
                fdb_assert_replication_up "$NAMESPACE" "$replica"
              fdb_write_keys "$NAMESPACE" "$primary" e2e-stop-after 20
              fdb_retry "new writes to reach the replica" \
                fdb_verify_keys "$NAMESPACE" "$replica" e2e-stop-after 20
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-stop
            tail: 200

    - name: the sentinels are monitoring again and can still fail over
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # The sentinels came back with a config file naming whichever pod
              # was the master before the stop. If that is now the replica, and
              # nothing corrected it, sentinel monitors the wrong server and the
              # first real outage goes unhandled.
              for pod in $(fdb_pods "$NAMESPACE" fdb-stop falkordb-sent); do
                fdb_retry "$pod to monitor a master again" \
                  fdb_assert_sentinel_monitoring "$NAMESPACE" "$pod"
              done

              # Reading sentinel's own view is not enough, because a sentinel
              # pointed at the wrong pod still answers SENTINEL masters happily.
              # Killing the primary is the only assertion that cannot be faked.
              #
              # The Stop took every server down, so each sentinel saw the master
              # +odown while it was coming back up and armed a two-minute
              # failover cooldown. Without shortening it the kill below is a
              # no-op: the pod returns as `+reboot master` and no election runs.
              fdb_sentinel_relax_failover_cooldown "$NAMESPACE" fdb-stop falkordb-sent fdb-stop-falkordb

              primary="$(fdb_primary "$NAMESPACE" fdb-stop falkordb)"
              echo "killing the primary $primary to prove failover survived the stop"
              fdb_kill_pod "$NAMESPACE" "$primary"

              fdb_retry "a new primary to be elected" bash -c '
                current=$(kubectl get pods -n "'"$NAMESPACE"'" \
                  -l "app.kubernetes.io/instance=fdb-stop,apps.kubeblocks.io/component-name=falkordb,kubeblocks.io/role=primary" \
                  -o jsonpath="{.items[0].metadata.name}" 2>/dev/null)
                [ -n "$current" ] || { echo "no primary yet" >&2; exit 1; }
                [ "$current" != "'"$primary"'" ] || { echo "$current is still the old primary" >&2; exit 1; }
                echo "$current was promoted"
              '

              fdb_retry "the cluster to settle" \
                fdb_assert_role_counts "$NAMESPACE" fdb-stop falkordb 1 1
              new_primary="$(fdb_primary "$NAMESPACE" fdb-stop falkordb)"
              fdb_verify_keys "$NAMESPACE" "$new_primary" e2e-stop 100
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-stop
            tail: 200
