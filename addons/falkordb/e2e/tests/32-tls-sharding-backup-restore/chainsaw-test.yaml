apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tls-sharding-backup-restore
spec:
  description: >-
    Back up a sharded FalkorDB cluster with TLS turned on and restore it into a
    new sharded cluster that also has TLS turned on.

    12-sharding-backup-restore covers sharded backup and restore in plaintext,
    and 19-tls-sharding covers a sharded TLS cluster without ever backing it
    up, so nothing has run the two together. They are not independent. With
    TLS on, the server sets `port 0` and only listens on the TLS port, so every
    data-protection job that dials a node has to speak TLS too: the backup's
    redis-cli, the restore's wait-for-ready check, and the ape-dts job that
    writes the dump back into the restored cluster, which is configured with a
    plain `redis://` URL.

    The certificates are user-provided with one CA shared by every shard, for
    the reason 19-tls-sharding gives. The restored cluster uses the same secret.
  steps:
    - name: issue one CA shared by every shard
      try:
        - script:
            content: |
              # Throwaway material for a single test namespace. See
              # 19-tls-sharding for why the shards need one shared CA and why
              # the certificate carries clientAuth as well as serverAuth.
              dir="$(mktemp -d)"
              trap 'rm -rf "$dir"' EXIT

              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -keyout "$dir/ca.key" -out "$dir/ca.crt" \
                -subj "/CN=falkordb-e2e-ca" >/dev/null 2>&1

              openssl req -newkey rsa:2048 -nodes \
                -keyout "$dir/tls.key" -out "$dir/tls.csr" \
                -subj "/CN=fdb-shtbk" >/dev/null 2>&1

              cat > "$dir/ext.cnf" <<EOF
              basicConstraints = CA:FALSE
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = DNS:localhost, DNS:*.${NAMESPACE}.svc, DNS:*.${NAMESPACE}.svc.cluster.local, IP:127.0.0.1
              EOF

              openssl x509 -req -in "$dir/tls.csr" -CA "$dir/ca.crt" \
                -CAkey "$dir/ca.key" -CAcreateserial -days 3650 \
                -out "$dir/tls.crt" -extfile "$dir/ext.cnf" >/dev/null 2>&1

              kubectl create secret generic fdb-shtbk-tls -n "$NAMESPACE" \
                --from-file=ca.crt="$dir/ca.crt" \
                --from-file=tls.crt="$dir/tls.crt" \
                --from-file=tls.key="$dir/tls.key"
      catch:
        - events: {}

    - name: create the source sharded cluster with TLS
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-shtbk
            tail: 200

    - name: the cluster refuses plaintext and owns every slot over TLS
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_assert_shard_count "$NAMESPACE" fdb-shtbk shard 3
              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-shtbk shard)"

              # Without this, a backup or restore job that only speaks plaintext
              # would pass simply because the server still accepted plaintext.
              if reply="$(fdb_cli "$NAMESPACE" "$pod" PING 2>&1)"; then
                case "$reply" in
                  *PONG*)
                    fdb_fail "$pod answered a plaintext PING; TLS is not being enforced"
                    exit 1
                    ;;
                esac
              fi
              fdb_log "$pod refuses plaintext connections"

              FDB_CLI_FLAGS="-c --tls --insecure"
              fdb_retry "all 16384 slots to be covered over TLS" \
                fdb_assert_slots_covered "$NAMESPACE" "$pod"
              fdb_retry "every shard to own its slots" \
                fdb_assert_shards_own_slots "$NAMESPACE" "$pod" 3
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-shtbk
            tail: 200

    - name: seed keys across every shard and flush them to disk
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
              - name: FDB_CLI_FLAGS
                value: "-c --tls --insecure"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-shtbk shard)"
              # Keys in every shard's slots, so a restore that loses or misplaces
              # one shard's dump cannot pass, and a graph, which lands in a
              # single shard and catches module data lost on that one shard.
              fdb_write_keys "$NAMESPACE" "$pod" e2e-shtbk 300
              fdb_verify_keys "$NAMESPACE" "$pod" e2e-shtbk 300
              fdb_graph_roundtrip "$NAMESPACE" "$pod" e2e-shtbk-graph

              # The backup reads each shard's dump, so every shard has to have
              # written one before the backup starts.
              for p in $(fdb_sharding_pods "$NAMESPACE" fdb-shtbk shard); do
                fdb_cli "$NAMESPACE" "$p" SAVE >/dev/null
                fdb_log "flushed $p to disk"
              done
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-shtbk
            tail: 200

    - name: back the TLS sharded cluster up
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # The BackupPolicy name is derived at run time, see
              # 12-sharding-backup-restore.
              policy="$(kubectl get backuppolicy -n "$NAMESPACE" \
                -l "app.kubernetes.io/instance=fdb-shtbk" \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [ -z "$policy" ]; then
                fdb_fail "no BackupPolicy was generated for fdb-shtbk"
                kubectl get backuppolicy -n "$NAMESPACE" >&2
                exit 1
              fi
              fdb_log "using BackupPolicy $policy"

              targets="$(kubectl get backuppolicy -n "$NAMESPACE" "$policy" \
                -o jsonpath='{range .spec.targets[*]}{.name}{"\n"}{end}' | grep -c . || true)"
              if [ "$targets" -lt 3 ]; then
                fdb_fail "expected one backup target per shard, got $targets"
                kubectl get backuppolicy -n "$NAMESPACE" "$policy" -o yaml >&2
                exit 1
              fi

              kubectl apply -n "$NAMESPACE" -f - <<EOF
              apiVersion: dataprotection.kubeblocks.io/v1alpha1
              kind: Backup
              metadata:
                name: fdb-shtbk-datafile
              spec:
                backupMethod: datafile
                backupPolicyName: $policy
                deletionPolicy: Delete
              EOF
        - assert:
            file: assert-backup-completed.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: dataprotection.kubeblocks.io/v1alpha1
            kind: Backup
            name: fdb-shtbk-datafile
        # The backup runs as Jobs, and a redis-cli that cannot reach the TLS
        # port only shows up in their logs.
        - script:
            content: |
              kubectl get jobs -n "$NAMESPACE" -o wide
              for job in $(kubectl get jobs -n "$NAMESPACE" \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
                echo "=== $job ==="
                kubectl logs -n "$NAMESPACE" "job/$job" --all-containers --tail=200 || true
              done

    - name: restore the backup into a new TLS sharded cluster
      try:
        - script:
            content: |
              # The restore annotation is keyed by the sharding name, see
              # 12-sharding-backup-restore.
              kubectl apply -n "$NAMESPACE" -f - <<EOF
              apiVersion: apps.kubeblocks.io/v1
              kind: Cluster
              metadata:
                name: fdb-shtbk-r
                annotations:
                  kubeblocks.io/restore-from-backup: '{"shard":{"name":"fdb-shtbk-datafile","namespace":"$NAMESPACE","volumeRestorePolicy":"Parallel"}}'
              spec:
                terminationPolicy: WipeOut
                clusterDef: falkordb
                topology: cluster
                shardings:
                  - name: shard
                    shardingDef: falkordb-cluster
                    shards: 3
                    template:
                      name: falkordb
                      disableExporter: true
                      replicas: 1
                      tls: true
                      issuer:
                        name: UserProvided
                        secretRef:
                          name: fdb-shtbk-tls
                          ca: ca.crt
                          cert: tls.crt
                          key: tls.key
                      resources:
                        limits:
                          cpu: '0.5'
                          memory: 512Mi
                        requests:
                          cpu: 100m
                          memory: 512Mi
                      volumeClaimTemplates:
                        - name: data
                          spec:
                            accessModes:
                              - ReadWriteOnce
                            resources:
                              requests:
                                storage: 1Gi
              EOF
        - assert:
            file: assert-restored-running.yaml
      catch:
        - events: {}
        - script:
            content: |
              kubectl get restore -n "$NAMESPACE" -o wide || true
              kubectl get jobs -n "$NAMESPACE" -o wide
              # The postReady jobs (wait-for-cluster-ready, then ape-dts) are
              # where a plaintext connection to the TLS port would fail.
              for job in $(kubectl get jobs -n "$NAMESPACE" \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
                echo "=== $job ==="
                kubectl logs -n "$NAMESPACE" "job/$job" --all-containers --tail=200 || true
              done
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-shtbk-r
            tail: 200
      cleanup:
        # Script-created, so chainsaw does not track it. See
        # 12-sharding-backup-restore.
        - script:
            content: |
              kubectl delete cluster fdb-shtbk-r -n "$NAMESPACE" \
                --ignore-not-found --wait=true --timeout=5m

    - name: the restored cluster enforces TLS, owns every slot and holds every key
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_assert_shard_count "$NAMESPACE" fdb-shtbk-r shard 3
              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-shtbk-r shard)"

              # A restore that only succeeded because the new cluster came up
              # without TLS would not answer the question this scenario asks.
              if reply="$(fdb_cli "$NAMESPACE" "$pod" PING 2>&1)"; then
                case "$reply" in
                  *PONG*)
                    fdb_fail "restored $pod answered a plaintext PING; TLS is not being enforced"
                    exit 1
                    ;;
                esac
              fi
              fdb_log "restored $pod refuses plaintext connections"

              FDB_CLI_FLAGS="-c --tls --insecure"
              fdb_retry "the restored cluster to cover all 16384 slots" \
                fdb_assert_slots_covered "$NAMESPACE" "$pod"
              fdb_retry "every restored shard to own its slots" \
                fdb_assert_shards_own_slots "$NAMESPACE" "$pod" 3

              fdb_retry "the restored keyspace to be complete" \
                fdb_verify_keys "$NAMESPACE" "$pod" e2e-shtbk 300
              fdb_assert_graph_node "$NAMESPACE" "$pod" e2e-shtbk-graph

              fdb_write_keys "$NAMESPACE" "$pod" e2e-shtbk-post 100
              fdb_verify_keys "$NAMESPACE" "$pod" e2e-shtbk-post 100
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-shtbk-r
            tail: 200
