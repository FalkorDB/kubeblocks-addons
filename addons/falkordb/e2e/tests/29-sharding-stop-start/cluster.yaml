apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-sstop
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: cluster
  shardings:
    - name: shard
      shardingDef: falkordb-cluster
      shards: 3
      template:
        name: falkordb-cluster
        disableExporter: true
        replicas: 2
        resources:
          limits:
            cpu: '0.5'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeClaimTemplates:
          - name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
