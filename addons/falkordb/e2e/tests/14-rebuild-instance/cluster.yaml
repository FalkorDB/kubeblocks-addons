apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-rebuild
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      disableExporter: true
      replicas: 2
      resources:
        limits:
          cpu: '0.5'
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 512Mi
      volumeClaimTemplates:
        - name: data
          spec:
            # RebuildInstance provisions a scratch PVC, waits for its PV and
            # rebinds that PV onto the rebuilt member. With a
            # WaitForFirstConsumer class (local-path, the k3d default) no PV
            # exists until the rebuild pod is scheduled, and KubeBlocks gives up
            # with `can not found the pv by the pvc "rebuild-<hash>-..."` before
            # the provisioner catches up. It is a race, so it passes on a fast
            # machine and fails on a loaded CI runner. The hostpath CSI class
            # the e2e setup installs binds Immediately, which removes the race
            # without weakening what this scenario actually covers.
            storageClassName: csi-hostpath-sc
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    - name: falkordb-sent
      replicas: 3
      resources:
        limits:
          cpu: '0.5'
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 256Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
