apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tls-failover
spec:
  description: >-
    Fail a TLS replication cluster over, both by a Switchover and by deleting
    the primary pod, with a client writing through the read-write Service the
    whole time. No write the old primary acknowledged may be lost, writes may
    stop only briefly, and the primary label has to follow Sentinel's master:
    the role probe asks a TLS-only Sentinel, and a probe that could not reach
    it labelled each pod from its own INFO replication (#44). The components
    share one user-supplied CA, as the sentinels need to verify the servers.
  steps:
    - name: generate a CA and a certificate both components share
      try:
        - script:
            content: |
              set -eu
              dir="$(mktemp -d)"
              trap 'rm -rf "$dir"' EXIT

              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
                -keyout "$dir/ca.key" -out "$dir/ca.crt" \
                -subj "/CN=falkordb-e2e-ca" >/dev/null 2>&1
              openssl req -newkey rsa:2048 -nodes \
                -keyout "$dir/tls.key" -out "$dir/tls.csr" \
                -subj "/CN=fdb-tlsfo" >/dev/null 2>&1

              # Servers and sentinels both dial each other, so the certificate
              # is for clients as well as servers. Clients connect with
              # --insecure, and Redis checks the chain only, so the names are
              # for completeness.
              cat > "$dir/ext.cnf" <<EOF
              basicConstraints = CA:FALSE
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = DNS:localhost, DNS:*.${NAMESPACE}.svc, DNS:*.${NAMESPACE}.svc.cluster.local, DNS:*.fdb-tlsfo-falkordb-headless.${NAMESPACE}.svc.cluster.local, DNS:*.fdb-tlsfo-falkordb-sent-headless.${NAMESPACE}.svc.cluster.local, IP:127.0.0.1
              EOF
              openssl x509 -req -in "$dir/tls.csr" -CA "$dir/ca.crt" \
                -CAkey "$dir/ca.key" -CAcreateserial -days 3650 \
                -out "$dir/tls.crt" -extfile "$dir/ext.cnf" >/dev/null 2>&1

              kubectl create secret generic fdb-tlsfo-tls -n "$NAMESPACE" \
                --from-file=ca.crt="$dir/ca.crt" \
                --from-file=tls.crt="$dir/tls.crt" \
                --from-file=tls.key="$dir/tls.key"
      catch:
        - events: {}

    - name: create the TLS-enabled cluster
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-tlsfo
            tail: 200

    - name: every sentinel sees the replica over TLS
      try:
        - script:
            env:
              - name: FDB_CLI_FLAGS
                value: "--tls --insecure"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_retry "a primary to be elected" \
                fdb_assert_role_counts "$NAMESPACE" fdb-tlsfo falkordb 1 1
              replica="$(fdb_pods_with_role "$NAMESPACE" fdb-tlsfo falkordb secondary)"
              fdb_retry "the encrypted replication link on $replica" \
                fdb_assert_replication_up "$NAMESPACE" "$replica"
              # A sentinel that cannot verify the servers still lists the
              # master it was told about, but learns of no replica and refuses
              # every failover with NOGOODSLAVE.
              for sent in $(fdb_pods "$NAMESPACE" fdb-tlsfo falkordb-sent); do
                fdb_retry "$sent to know the replica" \
                  fdb_assert_sentinel_knows_replicas "$NAMESPACE" "$sent" fdb-tlsfo-falkordb 1
              done
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-tlsfo
            tail: 200

    # The role probe asks Sentinel which pod is the primary. With a TLS-only
    # Sentinel and a probe that dialled it in the clear, it fell back to each
    # pod's own INFO replication, so during a failover the label (and the
    # Service that selects on it) could follow a pod Sentinel no longer
    # treated as the master (#44).
    - name: a switchover over TLS keeps every acknowledged write and the label on Sentinel's master
      try:
        - script:
            env:
              - name: FDB_CLI_FLAGS
                value: "--tls --insecure"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              primary="$(fdb_primary "$NAMESPACE" fdb-tlsfo falkordb)"
              candidate="$(fdb_pods_with_role "$NAMESPACE" fdb-tlsfo falkordb secondary)"
              fdb_retry "the primary label to follow sentinel" \
                fdb_assert_primary_label_follows_sentinel "$NAMESPACE" fdb-tlsfo falkordb
              fdb_start_writer "$NAMESPACE" fdb-tlsfo falkordb true

              kubectl apply -n "$NAMESPACE" -f - <<EOF
              apiVersion: operations.kubeblocks.io/v1alpha1
              kind: OpsRequest
              metadata:
                name: fdb-tlsfo-switchover
              spec:
                clusterName: fdb-tlsfo
                type: Switchover
                switchover:
                  - componentName: falkordb
                    instanceName: $primary
                    candidateName: $candidate
              EOF
              kubectl wait -n "$NAMESPACE" opsrequest/fdb-tlsfo-switchover \
                --for=jsonpath='{.status.phase}'=Succeed --timeout=10m

              fdb_retry "$candidate to be labelled primary" \
                fdb_pod_has_role "$NAMESPACE" "$candidate" primary
              fdb_retry "the primary label to follow sentinel" \
                fdb_assert_primary_label_follows_sentinel "$NAMESPACE" fdb-tlsfo falkordb
              fdb_retry "the primary service to follow the switchover to $candidate" \
                fdb_assert_service_primary "$NAMESPACE" fdb-tlsfo falkordb "$candidate"
              fdb_check_writer "$NAMESPACE" fdb-tlsfo falkordb 15
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-tlsfo
            tail: 200

    - name: deleting the primary over TLS keeps every acknowledged write and the label on Sentinel's master
      try:
        - script:
            env:
              - name: FDB_CLI_FLAGS
                value: "--tls --insecure"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              primary="$(fdb_primary "$NAMESPACE" fdb-tlsfo falkordb)"
              survivor="$(fdb_pods_with_role "$NAMESPACE" fdb-tlsfo falkordb secondary)"
              fdb_retry "the replication link on $survivor" \
                fdb_assert_replication_up "$NAMESPACE" "$survivor"
              fdb_start_writer "$NAMESPACE" fdb-tlsfo falkordb true

              fdb_kill_pod "$NAMESPACE" "$primary"

              fdb_retry "$survivor to be labelled primary" \
                fdb_pod_has_role "$NAMESPACE" "$survivor" primary
              fdb_retry "$primary to report slave" \
                fdb_assert_role "$NAMESPACE" "$primary" slave
              fdb_retry "the roles to settle" \
                fdb_assert_role_counts "$NAMESPACE" fdb-tlsfo falkordb 1 1
              fdb_retry "the primary label to follow sentinel" \
                fdb_assert_primary_label_follows_sentinel "$NAMESPACE" fdb-tlsfo falkordb
              fdb_retry "the primary service to follow the failover to $survivor" \
                fdb_assert_service_primary "$NAMESPACE" fdb-tlsfo falkordb "$survivor"
              fdb_check_writer "$NAMESPACE" fdb-tlsfo falkordb 15
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-tlsfo
            tail: 200
