apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reconfigure
spec:
  description: >-
    Changing a server parameter through a Reconfiguring OpsRequest. The reload
    action applies the value with CONFIG SET on every pod, so the OpsRequest can
    report Succeed while the change only ever lived in memory: the risk is that
    the value silently reverts the next time the servers restart, or that it was
    applied to the primary and quietly skipped on the replica. This restarts the
    component afterwards to prove the new value was rendered into the config the
    servers actually boot from.

    It also covers the other two ways a parameter can be handled. A parameter
    whose default is empty has to be emptied again once it was set, which only
    works through the quoted empty string because KubeBlocks drops a really
    empty value, and that empty value has to survive the restart too. And a
    parameter the addon owns is listed as immutable, so a Reconfiguring
    OpsRequest must never reach the servers with it.
  steps:
    - name: create the cluster and record the starting value
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: assert-running.yaml
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_retry "the roles to settle" \
                fdb_assert_role_counts "$NAMESPACE" fdb-config falkordb 1 1
              primary="$(fdb_primary "$NAMESPACE" fdb-config falkordb)"
              fdb_write_keys "$NAMESPACE" "$primary" e2e-config 50

              # If the cluster already booted with the value under test the whole
              # scenario proves nothing, so refuse to run rather than pass falsely.
              current="$(fdb_config_get "$NAMESPACE" "$primary" maxmemory-policy)"
              echo "maxmemory-policy starts as '$current'"
              [ "$current" != "allkeys-lru" ] || {
                echo "the cluster already uses allkeys-lru, pick another value" >&2
                exit 1; }
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 100

    - name: reconfigure maxmemory-policy
      try:
        - apply:
            file: reconfigure.yaml
        - assert:
            file: assert-reconfigure-succeeded.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-config-reconfigure
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200

    - name: every server took the new value
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # targetPodSelector is All, so a reload that only reached the primary
              # is a real failure mode and not just a timing artefact.
              for pod in $(fdb_pods "$NAMESPACE" fdb-config falkordb); do
                fdb_retry "maxmemory-policy on $pod" \
                  fdb_assert_config "$NAMESPACE" "$pod" maxmemory-policy allkeys-lru
                # The server normalizes the flags (KEA reads back as AKE), so
                # only check that the value is no longer the empty default.
                fdb_retry "notify-keyspace-events to be set on $pod" \
                  fdb_assert_config_not "$NAMESPACE" "$pod" notify-keyspace-events ""
              done
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200

    - name: empty notify-keyspace-events again
      try:
        - assert:
            file: assert-running.yaml
        - apply:
            file: reconfigure-empty.yaml
        - assert:
            file: assert-reconfigure-empty-succeeded.yaml
        - assert:
            file: assert-running.yaml
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # Two literal quote characters here mean the marker reached
              # CONFIG SET untranslated, and an unchanged value means KubeBlocks
              # dropped the change before the reload action ever ran.
              for pod in $(fdb_pods "$NAMESPACE" fdb-config falkordb); do
                fdb_retry "notify-keyspace-events to be empty on $pod" \
                  fdb_assert_config "$NAMESPACE" "$pod" notify-keyspace-events ""
              done
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-config-reconfigure-empty
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200

    - name: restart the component
      try:
        # KubeBlocks rejects a Restart while the cluster is still Updating from
        # the reconfigure above, so settle first rather than racing it.
        - assert:
            file: assert-running.yaml
        - apply:
            file: restart.yaml
        - assert:
            file: assert-restart-succeeded.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-config-restart
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200

    - name: the value survived the restart and so did the cluster
      try:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # A CONFIG SET that never reached the rendered config comes back as
              # the default here, which is exactly the silent regression this step
              # exists to catch.
              for pod in $(fdb_pods "$NAMESPACE" fdb-config falkordb); do
                fdb_retry "maxmemory-policy to still be set on $pod" \
                  fdb_assert_config "$NAMESPACE" "$pod" maxmemory-policy allkeys-lru
                # The rendered redis.conf now carries the quoted empty string,
                # which redis has to read back as empty rather than as quotes.
                fdb_retry "notify-keyspace-events to still be empty on $pod" \
                  fdb_assert_config "$NAMESPACE" "$pod" notify-keyspace-events ""
              done

              # A restart tears down both servers, so the roles have to re-converge
              # on a single primary rather than leaving two or none behind.
              fdb_retry "the roles to reconverge after the restart" \
                fdb_assert_role_counts "$NAMESPACE" fdb-config falkordb 1 1
              fdb_retry "the replica to link up again" \
                fdb_assert_all_replicas_linked "$NAMESPACE" fdb-config falkordb

              primary="$(fdb_primary "$NAMESPACE" fdb-config falkordb)"
              fdb_verify_keys "$NAMESPACE" "$primary" e2e-config 50
              fdb_write_keys "$NAMESPACE" "$primary" e2e-config-after 20
              replica="$(fdb_pods_with_role "$NAMESPACE" fdb-config falkordb secondary)"
              fdb_retry "new writes to reach $replica" \
                fdb_verify_keys "$NAMESPACE" "$replica" e2e-config-after 20
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200

    - name: an immutable parameter never reaches the servers
      try:
        - assert:
            file: assert-running.yaml
        - apply:
            file: reconfigure-immutable.yaml
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # KubeBlocks 1.2.0-alpha.1 silently drops an immutable parameter
              # and later versions fail the OpsRequest, so only the outcome on
              # the servers is asserted, once the OpsRequest is done either way.
              ops_done() {
                case "$(kubectl get opsrequest fdb-config-reconfigure-immutable \
                    -n "$NAMESPACE" -o jsonpath='{.status.phase}')" in
                  Succeed | Failed | Aborted | Cancelled) return 0 ;;
                esac
                return 1
              }
              fdb_retry "the immutable OpsRequest to finish" ops_done

              for pod in $(fdb_pods "$NAMESPACE" fdb-config falkordb); do
                fdb_assert_config "$NAMESPACE" "$pod" dbfilename dump.rdb
              done
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-config-reconfigure-immutable
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-config
            tail: 200
