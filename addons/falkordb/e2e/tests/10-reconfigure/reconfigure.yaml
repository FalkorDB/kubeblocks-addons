apiVersion: operations.kubeblocks.io/v1alpha1
kind: OpsRequest
metadata:
  name: fdb-config-reconfigure
spec:
  clusterName: fdb-config
  type: Reconfiguring
  reconfigures:
    - componentName: falkordb
      parameters:
        - key: maxmemory-policy
          value: allkeys-lru
        # Defaults to empty, so the next OpsRequest can prove it can be emptied
        # again.
        - key: notify-keyspace-events
          value: KEA
