apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: custom-ops-sharding
spec:
  description: >-
    Exercise the two custom OpsDefinitions that target a sharded cluster:
    falkordb-cluster-rebalance and falkordb-shard-account-ops.

    Neither had ever run. `type: Custom` appeared nowhere in the suite, so both
    OpsDefinitions were shipped on the strength of their YAML parsing and
    nothing else - the podInfoExtractor env wiring, the sharding-name lookup and
    the scripts they mount were all unverified.

    Rebalance is the riskier of the two. KubeBlocks runs it once per shard, all
    at the same time, and only the shard whose primary has the smallest node ID
    may move slots; the others have to stand down. A rebalance that moves slots
    and gives up half way leaves the cluster with holes in its keyspace, so the
    assertions below check the slot map and the data rather than the
    OpsRequest phase alone.

    A freshly created cluster is already balanced, and redis-cli does nothing
    at all on a balanced cluster, so a rebalance run there passes whether or
    not it works. The scenario skews the slot map first, moving 3000 slots
    from one primary to another, and then requires the rebalance to even it
    out again.
  steps:
    - name: create the sharded cluster
      try:
        - apply:
            file: cluster.yaml
        - assert:
            file: assert-running.yaml
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-cops
            tail: 200

    - name: the cluster forms and holds data
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
              - name: FDB_CLI_FLAGS
                value: "-c"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_assert_shard_count "$NAMESPACE" fdb-cops shard 3
              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-cops shard)"
              fdb_retry "all 16384 slots to be covered" \
                fdb_assert_slots_covered "$NAMESPACE" "$pod"
              fdb_retry "every shard to own its slots" \
                fdb_assert_shards_own_slots "$NAMESPACE" "$pod" 3

              # Enough keys that every shard owns some of them, so a rebalance
              # that drops a slot range cannot hide behind an empty shard.
              fdb_write_keys "$NAMESPACE" "$pod" e2e-cops 200
              fdb_verify_keys "$NAMESPACE" "$pod" e2e-cops 200
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-cops
            tail: 200

    - name: skew the slot map so the rebalance has work to do
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
              - name: FDB_CLI_FLAGS
                value: "-c"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-cops shard)"
              nodes="$(fdb_primary_slots "$NAMESPACE" "$pod")"
              donor="$(echo "$nodes" | awk 'NR == 1 {print $1}')"
              recipient="$(echo "$nodes" | awk 'NR == 2 {print $1}')"
              echo "$donor" > "$(fdb_state_dir)/donor"

              # 3000 slots leaves the donor with under half its share and the
              # recipient with over one and a half, far past the 2% redis-cli
              # tolerates before it considers a cluster unbalanced. The keys
              # in those slots move with them, so the data checks below cover
              # two migrations of the same slots, not one.
              fdb_log "moving 3000 slots from $donor to $recipient"
              if ! out="$(fdb_cluster_manager "$NAMESPACE" "$pod" reshard \
                --cluster-from "$donor" --cluster-to "$recipient" \
                --cluster-slots 3000 --cluster-yes 2>&1)"; then
                echo "$out" | tail -50 >&2
                fdb_fail "could not move slots from $donor to $recipient"
                exit 1
              fi

              fdb_retry "the reshard to close every slot it opened" \
                fdb_assert_no_open_slots "$NAMESPACE" "$pod"
              fdb_retry "all 16384 slots to be covered after the reshard" \
                fdb_assert_slots_covered "$NAMESPACE" "$pod"

              owned="$(fdb_node_slots "$NAMESPACE" "$pod" "$donor")"
              if [ "$owned" -gt 2500 ]; then
                fdb_fail "$donor still owns $owned slots after giving 3000 away"
                exit 1
              fi
              # Without this, everything after the rebalance would pass just as
              # well if the rebalance had never run.
              if fdb_assert_slots_balanced "$NAMESPACE" "$pod" 3 >/dev/null 2>&1; then
                fdb_fail "the slot map is still balanced, the rebalance would have nothing to do:"
                fdb_primary_slots "$NAMESPACE" "$pod" >&2
                exit 1
              fi
              fdb_log "the slot map is skewed:"
              fdb_primary_slots "$NAMESPACE" "$pod"

              fdb_verify_keys "$NAMESPACE" "$pod" e2e-cops 200
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-cops
            tail: 200

    - name: run the rebalance custom ops
      try:
        - apply:
            file: rebalance.yaml
        - assert:
            file: assert-rebalance-succeeded.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-cops-rebalance
        # The rebalance runs as a Job, so its container logs are the only place
        # a redis-cli failure is visible; the OpsRequest just reports Failed.
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"
              kubectl get jobs -n "$NAMESPACE" -o wide
              fdb_custom_ops_logs "$NAMESPACE"

    - name: the rebalance evened out the slots and left a complete, readable cluster
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
              - name: FDB_CLI_FLAGS
                value: "-c"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              fdb_assert_shard_count "$NAMESPACE" fdb-cops shard 3
              fdb_assert_single_rebalance_leader "$NAMESPACE"

              # Every node has to agree the slot map is whole. Checking a single
              # entry point is not enough: a node that was migrated away from
              # still answers happily about the slots it kept.
              for pod in $(fdb_sharding_pods "$NAMESPACE" fdb-cops shard); do
                fdb_retry "$pod to report a complete slot map" \
                  fdb_assert_slots_covered "$NAMESPACE" "$pod"
                fdb_retry "$pod to see no slot left in migration" \
                  fdb_assert_no_open_slots "$NAMESPACE" "$pod"
                fdb_retry "$pod to see every shard own its slots after the rebalance" \
                  fdb_assert_shards_own_slots "$NAMESPACE" "$pod" 3
                fdb_retry "$pod to see the slots evenly balanced" \
                  fdb_assert_slots_balanced "$NAMESPACE" "$pod" 3
              done

              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-cops shard)"
              donor="$(cat "$(fdb_state_dir)/donor")"
              owned="$(fdb_node_slots "$NAMESPACE" "$pod" "$donor")"
              fdb_log "$donor, which was left with under 2500 slots, owns $owned again"
              fdb_retry "every key to survive the rebalance" \
                fdb_verify_keys "$NAMESPACE" "$pod" e2e-cops 200

              # And the cluster must still accept writes afterwards.
              fdb_write_keys "$NAMESPACE" "$pod" e2e-cops-after 100
              fdb_verify_keys "$NAMESPACE" "$pod" e2e-cops-after 100
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-cops
            tail: 200

    - name: run the shard account custom ops
      try:
        - apply:
            file: account-ops.yaml
        - assert:
            file: assert-account-succeeded.yaml
      catch:
        - events: {}
        - describe:
            apiVersion: operations.kubeblocks.io/v1alpha1
            kind: OpsRequest
            name: fdb-cops-account
        - script:
            content: |
              for pod in $(kubectl get pods -n "$NAMESPACE" \
                -l app.kubernetes.io/managed-by=kubeblocks \
                -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
                case "$pod" in
                  *account-ops*|*shard-account*)
                    echo "=== $pod ==="
                    kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=100 || true
                    ;;
                esac
              done

    - name: the account exists on every shard and can actually log in
      try:
        - script:
            env:
              - name: FDB_CONTAINER
                value: falkordb-cluster
              - name: FDB_CLI_FLAGS
                value: "-c"
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"

              # The OpsRequest reaching Succeed only proves the job exited 0. The
              # script counts hosts itself and compares against REPLICAS, so it
              # can report success having reached a subset if the count happens
              # to line up. Ask each node directly instead.
              for pod in $(fdb_sharding_pods "$NAMESPACE" fdb-cops shard); do
                users="$(fdb_cli "$NAMESPACE" "$pod" ACL USERS | tr -d '\r')"
                case "$users" in
                  *e2e-shardops*) fdb_log "$pod knows e2e-shardops" ;;
                  *)
                    fdb_fail "$pod does not know e2e-shardops, users are: $users"
                    exit 1
                    ;;
                esac
              done

              # ACL SAVE is the second half of the script. Without it the account
              # is lost on restart, which is silent until the pod cycles.
              for pod in $(fdb_sharding_pods "$NAMESPACE" fdb-cops shard); do
                kubectl exec -n "$NAMESPACE" "$pod" -c falkordb-cluster -- \
                  sh -c 'grep -q "e2e-shardops" /data/users.acl' \
                  || fdb_log "$pod has no persisted users.acl entry (ACL SAVE target may differ)"
              done

              # Finally prove the credentials work, which the ACL USERS listing
              # does not: a user created without `on` is listed but cannot auth.
              pod="$(fdb_any_sharding_pod "$NAMESPACE" fdb-cops shard)"
              out="$(kubectl exec -n "$NAMESPACE" "$pod" -c falkordb-cluster -- \
                redis-cli -c --user e2e-shardops --pass shardops-pass --no-auth-warning PING \
                2>&1 | tr -d '\r')"
              case "$out" in
                *PONG*) fdb_log "e2e-shardops authenticated against $pod" ;;
                *)
                  fdb_fail "e2e-shardops could not authenticate against $pod: $out"
                  exit 1
                  ;;
              esac
      catch:
        - events: {}
        - podLogs:
            selector: app.kubernetes.io/instance=fdb-cops
            tail: 200
      finally:
        - script:
            content: |
              . "$E2E_LIB_DIR/falkordb.sh"
              fdb_clean_state_dir
