apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-shfo
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: cluster
  shardings:
    - name: shard
      shardingDef: falkordb-cluster
      shards: 3
      template:
        name: falkordb-cluster
        # Two per shard is what makes an in-shard failover possible at all. Every
        # other sharded scenario runs one replica per shard, so the replica
        # promotion path had never been reached.
        replicas: 2
        resources:
          limits:
            cpu: '0.5'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeClaimTemplates:
          - name: data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
