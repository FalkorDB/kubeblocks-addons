apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: fdb-nodeport
spec:
  terminationPolicy: WipeOut
  clusterDef: falkordb
  topology: replication
  componentSpecs:
    - name: falkordb
      disableExporter: true
      replicas: 2
      # Overriding the advertised service turns it into a per-pod NodePort, which
      # is what makes the servers announce a routable address to sentinel instead
      # of their cluster-internal pod IP.
      services:
        - name: falkordb-advertised
          serviceType: NodePort
          podService: true
      resources:
        limits:
          cpu: '0.5'
          memory: 512Mi
        requests:
          cpu: '0.2'
          memory: 512Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
    - name: falkordb-sent
      replicas: 3
      services:
        - name: sentinel-advertised
          serviceType: NodePort
          podService: true
      resources:
        limits:
          cpu: '0.5'
          memory: 256Mi
        requests:
          cpu: '0.1'
          memory: 256Mi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
