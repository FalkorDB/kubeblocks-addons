## Every redis.conf directive falls into one of three categories, which the
## Admin API mirrors (FalkorDB/FalkorDB-Enterprise#323):
##
##   * immutableParameters: owned by the addon, its start scripts or KubeBlocks,
##     and refused by KubeBlocks if a Reconfiguring operation tries to change
##     them,
##   * dynamicParameters: applied to the running server through CONFIG SET by
##     the reconfigure action, without restarting the pods,
##   * everything else: written to redis.conf and picked up by a rolling
##     restart. staticParameters lists the ones the addon knows about.

## Parameters that only take effect after the server is restarted.
##
## Because dynamicParameters is non empty, KubeBlocks treats every parameter
## that is not listed there as static anyway, so this list documents the known
## restart-only directives rather than defining them.
staticParameters:
  - databases
  - io-threads
  - io-threads-do-reads
  - falkordbe.offload-path

## Parameters the server accepts through CONFIG SET while it is running.
##
## Anything listed here is reloaded in place by the reconfigure action instead
## of forcing a rolling restart of the component. Because this list is non
## empty, KubeBlocks treats every parameter that is NOT listed here as static,
## regardless of the staticParameters list above, so any hot settable directive
## omitted from this list silently degrades into a rolling restart. That is why
## the enterprise module's `falkordbe.*` configs have to be enumerated here too.
##
## Directives whose name carries a subkey, such as `client-output-buffer-limit
## normal`, are left out: they are restarted rather than risk a partial reload.
dynamicParameters:
  - acl-pubsub-default
  - acllog-max-len
  - active-defrag-cycle-max
  - active-defrag-cycle-min
  - active-defrag-ignore-bytes
  - active-defrag-max-scan-fields
  - active-defrag-threshold-lower
  - active-defrag-threshold-upper
  - active-expire-effort
  - activedefrag
  - activerehashing
  - aof-disable-auto-gc
  - aof-load-truncated
