## Parameters the addon owns and KubeBlocks refuses to change.
##
## They wire the pod into the deployment: the data and ACL files, the listening
## ports and TLS material, replication and cluster topology, the announced
## addresses, the default account's credentials, and the switches that open
## MODULE and DEBUG to clients. The start scripts write most of them at boot,
## so an override in redis.conf would either be ignored or break the pod. This
## list matches the Admin API's ADDON_OWNED_SERVER_KEYS, which refuses the same
## keys (and every `tls-*` and `*announce*` key) before they reach KubeBlocks.
immutableParameters:
  - aclfile
  - appenddirname
  - appendfilename
  - bind
  - cluster-announce-bus-port
  - cluster-announce-hostname
  - cluster-announce-human-nodename
  - cluster-announce-ip
  - cluster-announce-port
  - cluster-announce-tls-port
  - cluster-config-file
  - cluster-enabled
  - cluster-port
  - cluster-preferred-endpoint-type
  - daemonize
  - dbfilename
  - dir
  - enable-debug-command
  - enable-module-command
  - enable-protected-configs
  - include
  - loadmodule
  - logfile
  - masterauth
  - masteruser
  - pidfile
  - port
  - protected-mode
  - rename-command
  - replica-announce-ip
  - replica-announce-port
  - replicaof
  - requirepass
  - slave-announce-ip
  - slave-announce-port
  - slaveof
