# Default values for falkordb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""

fullnameOverride: ""

## Values shared with a parent chart when this chart is used as a subchart.
global:
  ## Pull every image in this chart from this registry, whatever each image's own
  ## `registry` key says. This is the single value to set for a mirrored or
  ## air-gapped install; leave it empty to keep the per-image registries below.
  ##
  ## Only the registry host (and optional namespace prefix) belongs here - the
  ## repository and tag of each image are unchanged, e.g. setting
  ## `my-mirror.example.com/ns` renders `my-mirror.example.com/ns/busybox:1.36`.
  imageRegistry: ""

## Optionally specify an array of secrets used to pull the images from private registries.
## Entries may be plain secret names or objects with a `name` field, e.g.
## imagePullSecrets:
##   - my-registry-secret
##   - name: another-registry-secret
imagePullSecrets: []

## FalkorDB versions configuration
## Array of major versions, each containing minor versions with specific image tags
## @param serviceVersion define default serviceVersion of each Component
falkordbVersions:
  - major: "4"
    componentDef: "falkordb-4"
    clusterComponentDef: "falkordb-cluster-4"
    sentinelComponentDef: "falkordb-sent-4"
    serviceVersion: "4.20.1"
    defaultImageTag: "v4.20.1"
    repository: "falkordb/falkordb"
    mirrorVersions:
      - version: "4.20.1"
        imageTag: "v4.20.1"
      - version: "4.18.11"
        imageTag: "v4.18.11"
      - version: "4.18.8"
        imageTag: "v4.18.8"
      - version: "4.14.10"
        imageTag: "v4.14.10"
      - version: "4.12.5"
        imageTag: "v4.12.5"
      - version: "4.14.12"
        imageTag: "v4.14.12"

image:
  # refer: https://redis.io/docs/stack/
  # FalkorDB Stack Server, which combines open source FalkorDB,
  # is licensed under the Server Side Public License (SSPL)
  # For information about licensing per version, see https://github.com/falkordb/falkordb?tab=License-1-ov-file#readme
  registry: docker.io
  repository: falkordb/falkordb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:
    major4:
      minor20:
        patch1: v4.20.1
      minor18:
        patch11: v4.18.11
      minor8:
        patch8: v4.18.8
      minor14:
        patch10: v4.14.10
      minor12:
        patch5: v4.12.5

  # KNOWN ISSUE: every published ape-dts release up to and including
  # 2.0.26-alpha.16 mis-parses FalkorDB's `telemetry{<graph>}` stream keys (RDB
  # type byte 26). The parser desyncs, panics, and the process then hangs instead
  # of exiting, so a sharded restore silently stalls with a partial dataset.
  # The fix is https://github.com/apecloud/ape-dts/pull/564 - bump these tags to
  # the first release that carries it.
  apeDts:
    ## ape-dts is a third-party image and is not mirrored alongside FalkorDB's
    ## own images, so this must not inherit `image.registry`. Use
    ## `global.imageRegistry` to move every image at once.
    registry: docker.io
    repository: apecloud/ape-dts
    tag: 2.0.26-alpha.16
    reshardTag: 2.0.26-alpha.16

# See the apeDts note above: this tag has the same unfixed RDB stream parser.
apeDtsImage:
  ## Third-party image; see the note on `image.apeDts.registry`.
  registry: docker.io
  repository: apecloud/ape-dts
  tag: 2.0.26-alpha.16

dbctlImage:
  registry: docker.io
  repository: falkordb/kubeblocks-dbctl
  pullPolicy: IfNotPresent
  tag: v1.1.0

busyboxImage:
  ## Third-party image; see the note on `image.apeDts.registry`.
  registry: docker.io
  repository: busybox
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.36

metrics:
  image:
    ## Third-party image; see the note on `image.apeDts.registry`.
    registry: docker.io
    repository: falkordb/redis_exporter
    tag: v1.72.4
    pullPolicy: IfNotPresent
  service:
    port: 9121
    serverPort: 8888

# defined the data volume mount path of redis server
dataMountPath: /data

logConfigs: {}

# cluster domain without . prefix
clusterDomain: "cluster.local"

enableMetrics: true

tlsMountPath: /etc/pki/tls
