apiVersion: apps.kubeblocks.io/v1
kind: ClusterDefinition
metadata:
  name: falkordb
  labels:
    {{- include "falkordb.labels" . | nindent 4 }}
  annotations:
    {{- include "falkordb.apiVersion" . | nindent 4 }}
spec:
  topologies:
    - name: standalone
      components:
        - name: falkordb
          compDef: {{ include "falkordb.cmpdRegexpPattern" . }}
      default: true
    - name: replication
      components:
        - name: falkordb
          compDef:  {{ include "falkordb.cmpdRegexpPattern" . }}
        - name: falkordb-sent
          compDef:  {{ include "falkordbSentinel.cmpdRegexpPattern" . }}
      orders:
        provision:
          - falkordb-sent
          - falkordb
        terminate:
          - falkordb-sent
          - falkordb
        # The sentinels before the servers, as at provisioning: starting a
        # stopped cluster follows this order too, and a server with data
        # refuses to start while no sentinel is up, so with the servers first
        # neither would ever start. A move to another addon version is the
        # one update that wants the servers first, while servers on a version
        # before 1.8.3 pin their sentinel references to falkordb-sent-4-<their
        # version>: make it in two writes, servers then sentinels (see "Move a
        # replication cluster to another addon version" in the README).
        update:
          - falkordb-sent
          - falkordb
    - name: cluster
      shardings:
        - name: shard
          shardingDef: falkordb-cluster